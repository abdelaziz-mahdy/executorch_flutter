name: Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run build checks on every push to main
  build-checks:
    name: Build Checks
    uses: ./.github/workflows/build.yml

  # Check if version changed (only needed for release decision)
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version needs publishing
        id: check
        run: |
          # Get current version from pubspec.yaml
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "Current version: $CURRENT_VERSION"

          # Check if tag already exists locally
          if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "Tag v$CURRENT_VERSION already exists, skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get package info from pub.dev API
          PUB_DEV_RESPONSE=$(curl -s "https://pub.dev/api/packages/executorch_flutter")
          LATEST_PUB_VERSION=$(echo "$PUB_DEV_RESPONSE" | grep -o '"version":"[^"]*"' | head -1 | sed 's/"version":"//;s/"//')
          echo "Latest version on pub.dev: $LATEST_PUB_VERSION"

          # Check if current version is already published
          if echo "$PUB_DEV_RESPONSE" | grep -q "\"version\":\"$CURRENT_VERSION\""; then
            echo "Version $CURRENT_VERSION already published on pub.dev, skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT_VERSION not found on pub.dev, will publish"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

  # Create tag and GitHub Release (publish.yml handles pub.dev)
  create-release:
    name: Create Tag & Release
    needs: [check-version, build-checks]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          # Extract changelog section for this version
          CHANGELOG=$(awk "/^## $VERSION/,/^## [0-9]/" CHANGELOG.md | head -n -1 | tail -n +2)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release version $VERSION"
          fi
          # Handle multiline output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Download all example app build artifacts
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-artifacts/android

      - name: Download iOS Build
        uses: actions/download-artifact@v4
        with:
          name: ios-release-build
          path: release-artifacts/ios

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: macos-release-build
          path: release-artifacts/macos

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-release-build
          path: release-artifacts/windows

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: linux-release-build
          path: release-artifacts/linux

      # Package artifacts for release
      - name: Package release artifacts
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p release-packages

          # Android APK - rename for clarity
          mv release-artifacts/android/app-release.apk "release-packages/executorch_flutter_example-android-arm64-v${VERSION}.apk"

          # iOS - zip the .app bundle
          cd release-artifacts/ios
          zip -r "../../release-packages/executorch_flutter_example-ios-arm64-v${VERSION}.zip" Runner.app
          cd ../..

          # macOS - zip the .app bundle
          cd release-artifacts/macos
          zip -r "../../release-packages/executorch_flutter_example-macos-universal-v${VERSION}.zip" executorch_flutter_example.app
          cd ../..

          # Windows - zip the release folder
          cd release-artifacts/windows
          zip -r "../../release-packages/executorch_flutter_example-windows-x64-v${VERSION}.zip" .
          cd ../..

          # Linux - zip the bundle
          cd release-artifacts/linux
          zip -r "../../release-packages/executorch_flutter_example-linux-x64-v${VERSION}.zip" .
          cd ../..

          echo "Release packages:"
          ls -la release-packages/

      - name: Create and push tag
        env:
          # Use PAT to push tag so it triggers publish workflow
          # Create a PAT with 'contents: write' scope and add as repository secret 'RELEASE_TOKEN'
          # If RELEASE_TOKEN is not set, falls back to GITHUB_TOKEN (won't trigger publish workflow)
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ---

            ## Example App Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Android | arm64-v8a | [APK](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}/executorch_flutter_example-android-arm64-v${{ needs.check-version.outputs.version }}.apk) |
            | iOS | arm64 | [ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}/executorch_flutter_example-ios-arm64-v${{ needs.check-version.outputs.version }}.zip) |
            | macOS | Universal | [ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}/executorch_flutter_example-macos-universal-v${{ needs.check-version.outputs.version }}.zip) |
            | Windows | x64 | [ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}/executorch_flutter_example-windows-x64-v${{ needs.check-version.outputs.version }}.zip) |
            | Linux | x64 | [ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}/executorch_flutter_example-linux-x64-v${{ needs.check-version.outputs.version }}.zip) |

            ---

            📦 [View on pub.dev](https://pub.dev/packages/executorch_flutter/versions/${{ needs.check-version.outputs.version }})
          draft: false
          prerelease: false
          files: |
            release-packages/*
