name: Build & Release

on:
  # Build on every push to main
  push:
    branches:
      - main
    tags:
      - 'v*'  # Also trigger on version tags like v0.2.0
  # Manual trigger for release
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run build checks on every push
  build-checks:
    name: Build Checks
    uses: ./.github/workflows/build.yml

  # Get version from tag or input (only for releases)
  get-version:
    name: Get Version
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version from tag or input
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from tag (remove 'v' prefix)
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Create GitHub Release with example app artifacts (only on tag or manual trigger)
  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    needs: [get-version, build-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          # Extract changelog section for this version
          CHANGELOG=$(awk "/^## $VERSION/,/^## [0-9]/" packages/executorch_flutter/CHANGELOG.md | head -n -1 | tail -n +2)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release version $VERSION"
          fi
          # Handle multiline output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Download all example app build artifacts
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-artifacts/android

      - name: Download iOS Build
        uses: actions/download-artifact@v4
        with:
          name: ios-release-build
          path: release-artifacts/ios

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: macos-release-build
          path: release-artifacts/macos

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-release-build
          path: release-artifacts/windows

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: linux-release-build
          path: release-artifacts/linux

      # Package artifacts for release
      - name: Package release artifacts
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          mkdir -p release-packages

          # Android APK - rename for clarity
          mv release-artifacts/android/app-release.apk "release-packages/executorch_flutter_example-android-arm64-v${VERSION}.apk"

          # iOS - recreate .app bundle structure and zip
          mkdir -p release-artifacts/ios-app/Runner.app
          mv release-artifacts/ios/* release-artifacts/ios-app/Runner.app/ 2>/dev/null || true
          cd release-artifacts/ios-app
          zip -r "../../release-packages/executorch_flutter_example-ios-arm64-v${VERSION}.zip" Runner.app
          cd ../..

          # macOS - recreate .app bundle structure and zip
          mkdir -p release-artifacts/macos-app/executorch_flutter_example.app
          mv release-artifacts/macos/* release-artifacts/macos-app/executorch_flutter_example.app/ 2>/dev/null || true
          cd release-artifacts/macos-app
          zip -r "../../release-packages/executorch_flutter_example-macos-universal-v${VERSION}.zip" executorch_flutter_example.app
          cd ../..

          # Windows - zip the release folder
          cd release-artifacts/windows
          zip -r "../../release-packages/executorch_flutter_example-windows-x64-v${VERSION}.zip" .
          cd ../..

          # Linux - zip the bundle
          cd release-artifacts/linux
          zip -r "../../release-packages/executorch_flutter_example-linux-x64-v${VERSION}.zip" .
          cd ../..

          echo "Release packages:"
          ls -la release-packages/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: v${{ needs.get-version.outputs.version }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ---

            ## Example App Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Android | arm64-v8a | [APK](https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-version.outputs.version }}/executorch_flutter_example-android-arm64-v${{ needs.get-version.outputs.version }}.apk) |
            | iOS | arm64 | [ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-version.outputs.version }}/executorch_flutter_example-ios-arm64-v${{ needs.get-version.outputs.version }}.zip) |
            | macOS | Universal | [ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-version.outputs.version }}/executorch_flutter_example-macos-universal-v${{ needs.get-version.outputs.version }}.zip) |
            | Windows | x64 | [ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-version.outputs.version }}/executorch_flutter_example-windows-x64-v${{ needs.get-version.outputs.version }}.zip) |
            | Linux | x64 | [ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-version.outputs.version }}/executorch_flutter_example-linux-x64-v${{ needs.get-version.outputs.version }}.zip) |

            ---

            📦 [View on pub.dev](https://pub.dev/packages/executorch_flutter/versions/${{ needs.get-version.outputs.version }})
          draft: false
          prerelease: false
          files: |
            release-packages/*

  # Publish to pub.dev (only on tag or manual trigger, after release)
  publish:
    name: Publish to pub.dev
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    needs: [get-version, create-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for pub.dev OIDC authentication
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify packages
        run: |
          set +e
          for pkg in packages/executorch_dart packages/executorch_flutter; do
            echo "=== $pkg ==="
            dart pub publish --dry-run --directory="$pkg"
            exit_code=$?
            if [ $exit_code -eq 65 ]; then
              echo "⚠️ $pkg has warnings but can still be published"
            elif [ $exit_code -ne 0 ]; then
              echo "❌ $pkg validation failed (exit code $exit_code)"
              exit $exit_code
            fi
          done

      # Guarded so a re-run after a partial failure (core published, wrapper
      # not — the only failure state this order enforcement can produce)
      # recovers instead of aborting: pub.dev rejects re-publishing a
      # version that already exists, so check first and skip rather than
      # let that rejection fail the job before the wrapper gets a turn.
      - name: Publish executorch_dart
        env:
          TAG_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          version=$(grep '^version:' packages/executorch_dart/pubspec.yaml | sed 's/^version: *//')
          # pub.dev's OIDC check requires the tag version to equal the version
          # being published, so a package whose version does not match this tag
          # cannot publish from it. Skipping lets the two packages hold
          # different versions and release under their own tags.
          if [ "$version" != "$TAG_VERSION" ]; then
            echo "executorch_dart is $version, tag is $TAG_VERSION — not this package's release, skipping."
            exit 0
          fi
          http_status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/executorch_dart/versions/$version" || echo "000")
          if [ "$http_status" = "200" ]; then
            echo "executorch_dart $version is already on pub.dev — skipping (partial-publish recovery)."
          else
            dart pub publish --force --directory=packages/executorch_dart
          fi

      - name: Publish executorch_flutter
        env:
          TAG_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          version=$(grep '^version:' packages/executorch_flutter/pubspec.yaml | sed 's/^version: *//')
          # pub.dev's OIDC check requires the tag version to equal the version
          # being published, so a package whose version does not match this tag
          # cannot publish from it. Skipping lets the two packages hold
          # different versions and release under their own tags.
          if [ "$version" != "$TAG_VERSION" ]; then
            echo "executorch_flutter is $version, tag is $TAG_VERSION — not this package's release, skipping."
            exit 0
          fi
          http_status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/executorch_flutter/versions/$version" || echo "000")
          if [ "$http_status" = "200" ]; then
            echo "executorch_flutter $version is already on pub.dev — skipping (partial-publish recovery)."
          else
            dart pub publish --force --directory=packages/executorch_flutter
          fi
