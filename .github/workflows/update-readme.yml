name: Update README Versions

on:
  push:
    branches:
      - main
    paths:
      - 'lib/src/build/run_build.dart'
      - 'lib/src/version.dart'
      - 'pubspec.yaml'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract versions
        id: versions
        run: |
          # Extract executorchVersion from version.dart
          EXECUTORCH_VERSION=$(grep "const String executorchVersion" lib/src/version.dart | sed "s/.*= '\([^']*\)'.*/\1/")
          echo "ExecuTorch version: $EXECUTORCH_VERSION"

          # Extract build suffix from run_build.dart
          # Pattern: const String _defaultPrebuiltVersion = '$executorchVersion.X';
          BUILD_SUFFIX=$(grep "_defaultPrebuiltVersion" lib/src/build/run_build.dart | sed "s/.*\$executorchVersion\.\([0-9]*\)'.*/\1/")
          echo "Build suffix: $BUILD_SUFFIX"

          NATIVE_VERSION="${EXECUTORCH_VERSION}.${BUILD_SUFFIX}"
          echo "Full prebuilt version: $NATIVE_VERSION"
          echo "native_version=$NATIVE_VERSION" >> $GITHUB_OUTPUT

          # Extract package version from pubspec.yaml
          PACKAGE_VERSION=$(grep "^version:" pubspec.yaml | sed "s/version: //")
          echo "Package version: $PACKAGE_VERSION"
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Update README.md
        run: |
          NATIVE_VERSION="${{ steps.versions.outputs.native_version }}"
          PACKAGE_VERSION="${{ steps.versions.outputs.package_version }}"

          echo "Updating README.md:"
          echo "  - Native version: v$NATIVE_VERSION"
          echo "  - Package version: ^$PACKAGE_VERSION"

          # Update native version between NATIVE_VERSION markers
          sed -i "/<!-- NATIVE_VERSION_START -->/,/<!-- NATIVE_VERSION_END -->/c\\
          <!-- NATIVE_VERSION_START -->\\
          📊 **[Download Release Size Comparison (SVG)](https://github.com/abdelaziz-mahdy/executorch_native/releases/download/v${NATIVE_VERSION}/size-report-release.svg)** | **[Download Debug Size Comparison (SVG)](https://github.com/abdelaziz-mahdy/executorch_native/releases/download/v${NATIVE_VERSION}/size-report-debug.svg)** | **[JSON Report](https://github.com/abdelaziz-mahdy/executorch_native/releases/download/v${NATIVE_VERSION}/size-report.json)**\\
          <!-- NATIVE_VERSION_END -->" README.md

          # Update package version between PACKAGE_VERSION markers
          sed -i "/# PACKAGE_VERSION_START/,/# PACKAGE_VERSION_END/c\\
            # PACKAGE_VERSION_START\\
            executorch_flutter: ^${PACKAGE_VERSION}\\
            # PACKAGE_VERSION_END" README.md

          echo "README.md updated:"
          echo "--- Native version section ---"
          grep -A2 "NATIVE_VERSION_START" README.md || true
          echo "--- Package version section ---"
          grep -A2 "PACKAGE_VERSION_START" README.md || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README.md"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "README.md has been updated"
            git diff README.md
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: Update README versions (native: v${{ steps.versions.outputs.native_version }}, package: ^${{ steps.versions.outputs.package_version }})"
          git push
