name: Flutter Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
concurrency:
  group: auto-deploy
  cancel-in-progress: true

jobs:
  build_web:
    name: Build Flutter Web, Deploy
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
        
      - name: Install Flutter Dependencies
        working-directory: packages/executorch_flutter/example
        run: flutter pub get

      - name: Setup Web Files
        working-directory: packages/executorch_flutter/example
        run: dart run ../bin/setup_web.dart

      - name: Build Flutter Web
        working-directory: packages/executorch_flutter/example
        run: |
          flutter build web --release \
            --base-href "/executorch_flutter/" \
            --dart-define=MODEL_BASE_URL=models \
            --dart-define=LLM_CATALOG_URL=models/llms.json

      # GitHub release assets send no Access-Control-Allow-Origin header, so a
      # browser cannot fetch them cross-origin — model loading fails in the
      # deployed demo. Download them here instead, server-side where CORS does
      # not apply, and serve them from the site's own origin.
      #
      # Only XNNPACK models are fetched: it is the sole backend the Wasm build
      # supports, and the app's model picker already filters to it on web.
      - name: Fetch models into the published site
        working-directory: packages/executorch_flutter/example
        run: |
          set -euo pipefail
          VERSION=$(grep -oE "executorchVersion = '[^']+'" \
            ../../executorch_dart/lib/src/version.dart | cut -d"'" -f2)
          echo "Pinned ExecuTorch version: $VERSION"

          INDEX="https://raw.githubusercontent.com/abdelaziz-mahdy/executorch_flutter_models/main/$VERSION/index.json"
          mkdir -p build/web/models
          curl -fsSL "$INDEX" -o /tmp/index.json

          python3 - "$VERSION" <<'PY'
          import json, subprocess, sys
          version = sys.argv[1]
          models = json.load(open('/tmp/index.json'))['models']
          xnnpack = [m for m in models if m['backend'] == 'xnnpack']
          if not xnnpack:
              sys.exit(f'No xnnpack models in the {version} index')

          def fetch(url):
              name = url.split('?')[0].rsplit('/', 1)[-1]
              subprocess.run(
                  ['curl', '-fsSL', url, '-o', f'build/web/models/{name}'],
                  check=True)
              return name

          total = 0
          labels = set()
          for m in xnnpack:
              print(f"  {m['name']} ({m['sizeMB']} MB)")
              fetch(m['remoteUrl'])
              total += m['size']
              # Label files are fetched from the same release and hit the same
              # CORS wall, so they must be served from our origin too.
              if m.get('labelsRemoteUrl'):
                  labels.add(m['labelsRemoteUrl'])

          for url in sorted(labels):
              print(f"  {fetch(url)}")

          print(f"Fetched {len(xnnpack)} models ({total / 1e6:.1f} MB) "
                f"and {len(labels)} label files")
          PY

          ls -la build/web/models | head -12

      # The hosted LLMs hit the same CORS wall. The web runner is XNNPACK-only,
      # so only the CPU builds are copied (Qwen3 0.6B: about 480 MB with its
      # tokenizer; GitHub Pages allows a 1 GB site). The deploy pushes the site
      # to the gh-pages branch, and git refuses files over 100 MB, so larger
      # files are split into 90 MB parts listed in <file>.parts.json, which
      # ExecuTorchLLM's web worker and the example both reassemble.
      - name: Fetch hosted LLMs into the published site
        working-directory: packages/executorch_flutter/example
        run: |
          set -euo pipefail
          VERSION=$(grep -oE "executorchVersion = '[^']+'" \
            ../../executorch_dart/lib/src/version.dart | cut -d"'" -f2)
          LLMS="https://raw.githubusercontent.com/abdelaziz-mahdy/executorch_flutter_models/main/$VERSION/llms.json"
          STATUS=$(curl -sS -o /tmp/llms.json -w '%{http_code}' "$LLMS")
          if [ "$STATUS" = "404" ]; then
            # The app was built to read models/llms.json; an empty catalog
            # makes it list no hosted models instead of failing to load one.
            echo "::warning::No hosted LLMs for $VERSION; publishing an empty catalog"
            echo '{"llms": []}' > /tmp/llms.json
          elif [ "$STATUS" != "200" ]; then
            echo "::error::Fetching $LLMS failed with HTTP $STATUS"
            exit 1
          fi

          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from urllib.parse import unquote, urlsplit
          PART = 90 * 1024 * 1024
          llms = json.load(open('/tmp/llms.json'))['llms']
          total = 0
          fetched = {}  # name -> sha256 of the LLM files placed so far
          for llm in (l for l in llms if l['backend'] == 'xnnpack'):
              for f in llm['files'].values():
                  path = f"build/web/models/{f['name']}"
                  # The app requests models/<decoded last path segment of
                  # url>; it must be this name, and must not replace another
                  # model's file.
                  if unquote(urlsplit(f['url']).path.rsplit('/', 1)[-1]) != f['name']:
                      raise SystemExit(f"{f['name']}: name doesn't match {f['url']}")
                  if f['name'] in fetched:
                      # Shared by two LLMs (a common tokenizer): fine if equal.
                      if fetched[f['name']] != f['sha256']:
                          raise SystemExit(f"two different files named {f['name']}")
                      continue
                  if os.path.exists(path) or os.path.exists(f"{path}.parts.json"):
                      raise SystemExit(f"{f['name']} would overwrite another file")
                  fetched[f['name']] = f['sha256']
                  print(f"  {f['name']} ({f['size'] / 1e6:.1f} MB)")
                  subprocess.run(['curl', '-fsSL', f['url'], '-o', path], check=True)
                  digest = hashlib.sha256(open(path, 'rb').read()).hexdigest()
                  if os.path.getsize(path) != f['size'] or digest != f['sha256']:
                      raise SystemExit(f"{f['name']} does not match llms.json")
                  total += f['size']
                  if f['size'] <= PART:
                      continue
                  parts = []
                  with open(path, 'rb') as src:
                      while chunk := src.read(PART):
                          name = f"{f['name']}.part{len(parts):03d}"
                          open(f"build/web/models/{name}", 'wb').write(chunk)
                          parts.append(name)
                  os.remove(path)
                  json.dump({'size': f['size'], 'parts': parts},
                            open(f"{path}.parts.json", 'w'))
                  print(f"    split into {len(parts)} parts")
          if llms and not fetched:
              print("::warning::The catalog lists no CPU (XNNPACK) LLMs; the web demo will offer none")
          print(f"Fetched {total / 1e6:.1f} MB of LLM files")
          PY
          # The app reads this copy (LLM_CATALOG_URL above), not the live one,
          # so its sizes and hashes always match the files served next to it.
          cp /tmp/llms.json build/web/models/llms.json

          du -sh build/web
          # Nothing over GitHub's 100 MB push limit may reach the deploy.
          if find build/web -type f -size +95M | grep .; then
            echo "::error::Files over 95 MB would be refused by the gh-pages push"
            exit 1
          fi
          # GitHub Pages sites are limited to 1 GB.
          SITE_BYTES=$(find build/web -type f -exec stat -f %z {} + | awk '{s+=$1} END {print s}')
          if [ "$SITE_BYTES" -gt 1000000000 ]; then
            echo "::error::The site is $SITE_BYTES bytes; GitHub Pages allows 1 GB"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/executorch_flutter/example/build/web
