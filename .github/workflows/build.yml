name: Build

on:
  # Only run on PRs and manual triggers - main branch builds are handled by release.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:  # Allow this workflow to be called by other workflows

# Cancel in-progress runs when a new run is triggered
# Use run_id for workflow_call to avoid deadlock with parent workflow
concurrency:
  group: build-${{ github.event_name == 'workflow_call' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  # Android Release Build
  # Using macos-14 instead of ubuntu-latest due to Flutter SPM compatibility issue
  # Issue: https://github.com/flutter/flutter/issues/162594
  # Fix merged but not released yet: https://github.com/flutter/flutter/pull/178073
  build-android:
    name: Build Android (Release)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Get dependencies
        run: flutter pub get
        working-directory: example

      - name: Build Android APK (Release)
        run: flutter build apk --release
        working-directory: example

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: example/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # iOS Release Build
  build-ios:
    name: Build iOS (Release)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      # Increase Git buffer size for large SPM packages (ExecuTorch is ~2GB)
      - name: Configure Git for large repositories
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0

      - name: Get dependencies
        run: flutter pub get
        working-directory: example

      - name: Build iOS (Release, no codesign)
        run: flutter build ios --release --no-codesign
        working-directory: example

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: example/build/ios/iphoneos/Runner.app
          retention-days: 7

  # macOS Release Build
  build-macos:
    name: Build macOS (Release)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      # Increase Git buffer size for large SPM packages (ExecuTorch is ~2GB)
      - name: Configure Git for large repositories
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0

      - name: Get dependencies
        run: flutter pub get
        working-directory: example

      - name: Build macOS (Release)
        run: flutter build macos --release
        working-directory: example

      - name: Run integration tests
        run: flutter test integration_test/models_integration_test.dart -d macos
        working-directory: example
        timeout-minutes: 30

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-build
          path: example/build/macos/Build/Products/Release/executorch_flutter_example.app
          retention-days: 7

  # Windows Build
  # Tests that the package compiles on Windows with prebuilt native libraries
  build-windows:
    name: Build Windows (Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Get dependencies
        run: flutter pub get
        working-directory: example

      - name: Build Windows (Release)
        run: flutter build windows --release
        working-directory: example

      - name: Run integration tests
        run: flutter test integration_test/models_integration_test.dart -d windows
        working-directory: example
        timeout-minutes: 30

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-build
          path: example/build/windows/x64/runner/Release/
          retention-days: 7

  # Linux Build
  # Tests that the package compiles on Linux with prebuilt native libraries
  build-linux:
    name: Build Linux (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Get dependencies
        run: flutter pub get
        working-directory: example

      - name: Build Linux (Release)
        run: flutter build linux --release
        working-directory: example

      - name: Run integration tests
        run: flutter test integration_test/models_integration_test.dart -d linux
        working-directory: example
        timeout-minutes: 30

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-build
          path: example/build/linux/x64/release/bundle/
          retention-days: 7

  # Analyze and Format Check (package only, not example app)
  # Using macos-14 instead of ubuntu-latest due to Flutter SPM compatibility issue
  # Issue: https://github.com/flutter/flutter/issues/162594
  # Fix merged but not released yet: https://github.com/flutter/flutter/pull/178073
  analyze:
    name: Analyze & Format
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze lib

      - name: Check formatting
        run: dart format --set-exit-if-changed lib
