name: Publish to pub.dev (Manual)

on:
  # Manual trigger only - automatic publishing is handled by release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.2.1)'
        required: true

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for pub.dev OIDC authentication
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify packages
        run: |
          set +e
          for pkg in packages/executorch_dart packages/executorch_flutter; do
            echo "=== $pkg ==="
            dart pub publish --dry-run --directory="$pkg"
            exit_code=$?
            if [ $exit_code -eq 65 ]; then
              echo "⚠️ $pkg has warnings but can still be published"
            elif [ $exit_code -ne 0 ]; then
              echo "❌ $pkg validation failed (exit code $exit_code)"
              exit $exit_code
            fi
          done

      # Guarded so a re-run after a partial failure (core published, wrapper
      # not — the only failure state this order enforcement can produce)
      # recovers instead of aborting: pub.dev rejects re-publishing a
      # version that already exists, so check first and skip rather than
      # let that rejection fail the job before the wrapper gets a turn.
      - name: Publish executorch_dart
        run: |
          version=$(grep '^version:' packages/executorch_dart/pubspec.yaml | sed 's/^version: *//')
          http_status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/executorch_dart/versions/$version" || echo "000")
          if [ "$http_status" = "200" ]; then
            echo "executorch_dart $version is already on pub.dev — skipping (partial-publish recovery)."
          else
            dart pub publish --force --directory=packages/executorch_dart
          fi

      - name: Publish executorch_flutter
        run: |
          version=$(grep '^version:' packages/executorch_flutter/pubspec.yaml | sed 's/^version: *//')
          http_status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/executorch_flutter/versions/$version" || echo "000")
          if [ "$http_status" = "200" ]; then
            echo "executorch_flutter $version is already on pub.dev — skipping (partial-publish recovery)."
          else
            dart pub publish --force --directory=packages/executorch_flutter
          fi
