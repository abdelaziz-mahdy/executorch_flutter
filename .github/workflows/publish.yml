name: Publish to pub.dev (Manual)

on:
  # Manual trigger only - automatic publishing is handled by release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.2.1)'
        required: true

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for pub.dev OIDC authentication
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify package
        run: |
          set +e
          dart pub publish --dry-run
          exit_code=$?
          if [ $exit_code -eq 65 ]; then
            echo "⚠️ Package has warnings but can still be published (exit code 65)"
            echo "This is expected due to git submodules being detected as gitignored"
            exit 0
          elif [ $exit_code -ne 0 ]; then
            echo "❌ Package validation failed (exit code $exit_code)"
            exit $exit_code
          fi

      - name: Publish to pub.dev
        run: dart pub publish --force
