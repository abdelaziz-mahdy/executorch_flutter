name: Publish to pub.dev

on:
  # Only trigger after Build & Release workflow completes successfully on a tag
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.1.0)'
        required: true

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    # Only run if:
    # 1. Manual trigger, OR
    # 2. Build & Release succeeded AND it was a tag push (not main branch)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions:
      id-token: write  # Required for pub.dev OIDC authentication
    steps:
      - name: Get tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify package
        run: |
          set +e
          dart pub publish --dry-run
          exit_code=$?
          if [ $exit_code -eq 65 ]; then
            echo "⚠️ Package has warnings but can still be published (exit code 65)"
            echo "This is expected due to git submodules being detected as gitignored"
            exit 0
          elif [ $exit_code -ne 0 ]; then
            echo "❌ Package validation failed (exit code $exit_code)"
            exit $exit_code
          fi

      - name: Publish to pub.dev
        run: dart pub publish --force
