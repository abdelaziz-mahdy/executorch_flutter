name: executorch_flutter
description: >
  ExecuTorch on-device ML inference for Flutter using dart:ffi — vision models
  plus experimental streaming LLM. Android, iOS, macOS, Linux, Windows, Web.
version: 0.7.1
homepage: https://github.com/abdelaziz-mahdy/executorch_flutter
repository: https://github.com/abdelaziz-mahdy/executorch_flutter

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  executorch_dart: ^0.7.1
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  hooks: ">=1.0.0 <3.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      # Declares Web support to pub tooling. The registrant does no work — the
      # WebAssembly implementation is reached through conditional exports — but
      # without this entry pub.dev reports the package as not supporting Web.
      web:
        pluginClass: ExecutorchFlutterWebPlugin
        fileName: src/web/executorch_web_plugin.dart

executables:
  setup_web: setup_web

topics:
  - machine-learning
  - pytorch
  - ai
  - ffi
  - mobile
