name: executorch_dart
description: >
  ExecuTorch on-device ML inference for pure Dart using dart:ffi — vision
  models plus experimental streaming LLM. Android, iOS, macOS, Linux, Windows.
version: 0.7.0
homepage: https://github.com/abdelaziz-mahdy/executorch_flutter
repository: https://github.com/abdelaziz-mahdy/executorch_flutter

environment:
  sdk: '>=3.10.0 <4.0.0'

resolution: workspace

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.4
  hooks: ">=1.0.0 <3.0.0"
  logging: ^1.3.0
  meta: ^1.9.1
  native_toolchain_cmake: ">=0.2.2 <0.4.0"

dev_dependencies:
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.25.0

topics:
  - machine-learning
  - pytorch
  - ai
  - ffi

hooks:
  user_defines:
    executorch_dart:
      debug: false
      build_mode: "prebuilt"
