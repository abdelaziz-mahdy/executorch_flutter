# ffigen Configuration for the standalone tokenizer FFI
#
# Generates Dart bindings from executorch_tokenizer_ffi.h. Reuses the symbols
# already generated for executorch_ffi.h (ETStatus, ETErrorCode) via the
# imported symbol-file so they are NOT redefined here.
#
# Run: dart run ffigen --config ffigen_tokenizer.yaml

name: ExecutorchTokenizerNative
description: FFI bindings for the ExecuTorch standalone tokenizer

output:
  bindings: lib/src/generated/executorch_tokenizer_ffi.g.dart

# Link to the same native asset as the core bindings
ffi-native:
  asset-id: 'package:executorch_dart/executorch_dart.dart'

# Reuse already-generated symbols (ETStatus, ETErrorCode, ...)
import:
  symbol-files:
    - 'package:executorch_dart/src/generated/executorch_symbols.yaml'

# Parse the tokenizer header (it includes executorch_ffi.h), but only GENERATE
# bindings for declarations that live in the tokenizer header itself.
headers:
  entry-points:
    - native/src/executorch_tokenizer_ffi.h
  include-directives:
    - '**executorch_tokenizer_ffi.h'

functions:
  include:
    - 'et_tokenizer_.*'
  # Pure lookups with no allocation, callbacks or error paths — cheaper as leaf
  # calls. The encode/decode/create entry points are NOT leaf: they allocate and
  # can run arbitrarily long on large inputs.
  leaf:
    include:
      - et_tokenizer_vocab_size
      - et_tokenizer_bos_id
      - et_tokenizer_eos_id
      - et_tokenizer_is_loaded
  # Needed so ffigen emits `addresses`, which NativeFinalizer attaches to.
  symbol-address:
    include:
      - et_tokenizer_free

structs:
  include:
    - ETTokenizer

silence-enum-warning: true
enums:
  rename:
    'ET_(.*)': '$1'

preamble: |
  // AUTO GENERATED FILE, DO NOT EDIT.
  // Generated by ffigen.
  //
  // FFI bindings for the ExecuTorch standalone tokenizer
  // See: native/src/executorch_tokenizer_ffi.h

comments:
  style: doxygen
  length: full
