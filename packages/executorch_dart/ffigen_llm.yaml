# ffigen Configuration for the ExecuTorch LLM (text generation) FFI
#
# Generates Dart bindings from executorch_llm_ffi.h. Reuses the symbols already
# generated for executorch_ffi.h (ETStatus, ETErrorCode, ETCallback_1) via the
# imported symbol-file so they are NOT redefined here.
#
# Run: dart run ffigen --config ffigen_llm.yaml

name: ExecutorchLlmNative
description: FFI bindings for the ExecuTorch LLM runner

output:
  bindings: lib/src/generated/executorch_llm_ffi.g.dart

# Link to the same native asset as the core bindings
ffi-native:
  asset-id: 'package:executorch_dart/executorch_dart.dart'

# Reuse already-generated symbols (ETStatus, ETErrorCode, ETCallback_1, ...)
import:
  symbol-files:
    - 'package:executorch_dart/src/generated/executorch_symbols.yaml'

# Parse the llm header (it includes executorch_ffi.h), but only GENERATE bindings
# for declarations that live in the llm header itself.
headers:
  entry-points:
    - native/src/executorch_llm_ffi.h
  include-directives:
    - '**executorch_llm_ffi.h'

functions:
  include:
    - 'et_llm_.*'
  leaf:
    include:
      - et_llm_is_loaded
  symbol-address:
    include:
      - et_llm_runner_free

structs:
  include:
    - ETGenConfig
    - ETLLMRunner

silence-enum-warning: true
enums:
  rename:
    'ET_(.*)': '$1'

typedefs:
  include:
    - ETTokenCallback

preamble: |
  // AUTO GENERATED FILE, DO NOT EDIT.
  // Generated by ffigen.
  //
  // FFI bindings for the ExecuTorch LLM runner
  // See: native/src/executorch_llm_ffi.h

comments:
  style: doxygen
  length: full
