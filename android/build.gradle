group 'com.zcreations.executorch_flutter'
version '1.0.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.zcreations.executorch_flutter'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 23  // Required for ExecuTorch
        consumerProguardFiles 'proguard-rules.pro'
    }

    dependencies {
        // Note: ExecuTorch native libraries are provided via native assets (dart:ffi)
        // The FFI library is built with CMake and requires libc++_shared.so

        // fbjni provides libc++_shared.so which is needed by libexecutorch_ffi.so
        implementation 'com.facebook.fbjni:fbjni:0.7.0'

        // AndroidX annotations (for @NonNull, @Nullable)
        implementation 'androidx.annotation:annotation:1.7.1'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}