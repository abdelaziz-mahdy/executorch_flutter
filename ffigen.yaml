# ffigen Configuration for ExecuTorch Flutter FFI
#
# This configuration generates Dart FFI bindings from executorch_ffi.h
#
# Run: dart run ffigen --config ffigen.yaml

name: ExecutorchNative
description: FFI bindings for ExecuTorch Flutter

# Output configuration
output:
  bindings: lib/src/generated/executorch_ffi.g.dart
  symbol-file:
    output: 'package:executorch_flutter/src/generated/executorch_symbols.yaml'
    import-path: 'package:executorch_flutter/src/generated/executorch_ffi.g.dart'

# Link to native asset
ffi-native:
  asset-id: 'package:executorch_flutter/executorch_flutter.dart'

# Header files to parse
headers:
  entry-points:
    - src/executorch_ffi.h

# Function configuration
functions:
  # Leaf functions (simple, no callbacks) - more efficient calls
  leaf:
    include:
      - et_tensor_dtype
      - et_tensor_rank
      - et_tensor_shape
      - et_tensor_data_size
      - et_tensor_data
      - et_module_input_count
      - et_module_output_count
      - et_backend_available
      - et_backend_list
      - et_version
      - et_executorch_version

  # Symbol addresses needed for NativeFinalizer
  symbol-address:
    include:
      - et_module_free
      - et_tensor_free
      - et_status_free

# Enum handling - silence warning since we control enum sizes in C
silence-enum-warning: true
enums:
  rename:
    # Remove ET_ prefix for cleaner Dart names
    'ET_(.*)': '$1'

# Struct handling
structs:
  # Keep ETStatus as Struct for direct access
  include:
    - ETStatus

# Exclude system macros
macros:
  exclude:
    - '__.*'
    - '_.*'

# Preamble for generated file
preamble: |
  // AUTO GENERATED FILE, DO NOT EDIT.
  // Generated by ffigen.
  //
  // FFI bindings for ExecuTorch Flutter
  // See: src/executorch_ffi.h

# Documentation style
comments:
  style: doxygen
  length: full
