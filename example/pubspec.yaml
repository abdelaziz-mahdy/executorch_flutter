name: executorch_flutter_example
description: "Demonstrates how to use the executorch_flutter plugin."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  executorch_flutter:
    # When depending on this package from a real application you should use:
    #   executorch_flutter: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

  # Camera plugin for real-time inference demo
  camera: ^0.11.3

  # HTTP client for downloading models from network
  http: ^1.6.0

  # Cryptographic hashing for model integrity verification
  crypto: ^3.0.6

  # Path provider for file system access
  path_provider: ^2.1.3

  # Image processing for tensor preprocessing
  image: ^4.2.0

  # Image picker for demo
  image_picker: ^1.0.7

  # File picker for selecting local LLM model + tokenizer files (chat demo)
  file_selector: ^1.0.3

  # Permission handling for camera access
  permission_handler: ^12.0.1

  # Settings persistence for UI preferences
  shared_preferences: ^2.2.3

  # Device info for performance optimization
  device_info_plus: ^12.3.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dartcv4: ^2.2.1+1

  # Dependency injection for camera controllers
  get_it: ^9.2.0

  image_picker_platform_interface: any
  meta: any
  universal_platform: ^1.1.0

# Native assets build configuration
hooks:
  user_defines:
    executorch_flutter:
      debug: true
      # Default: prebuilt binaries (fast, no toolchain needed) — vision models
      # (MobileNet, YOLO) work out of the box on every platform.
      backends:
        - xnnpack
        - vulkan
      #
      # ─── Opt in to the on-device LLM (Gemma 4) — local source build ─────────
      # The LLM runner + MLX backend are not in the prebuilt binaries yet, so to
      # run the Gemma 4 chat you must build ExecuTorch from source. Uncomment the
      # lines below (and adjust `backends`) to enable it. This is heavy: the first
      # source build takes ~30-60 min, and MLX needs the Xcode Metal Toolchain
      # (`xcodebuild -downloadComponent MetalToolchain`) + macOS 14. See the LLM
      # docs for model export, the mlx.metallib, and full setup.
      #
      #   build_mode: "source"
      #   llm: true
      #   backends:
      #     - xnnpack
      #     - mlx        # Apple-Silicon GPU (macOS arm64, macOS 14+). Omit for CPU.
      #   # Optional: reuse a local ExecuTorch v1.3.1 checkout for faster builds
      #   # (else it is fetched automatically). Prefer the env var so no machine
      #   # path is committed:  export EXECUTORCH_SOURCE_DIR=/abs/path/to/executorch
      #   # executorch_source: "/abs/path/to/your/executorch"
    dartcv4:
      include_modules:
        - imgproc
        - imgcodecs
        - videoio

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Test images only (models and labels are downloaded at runtime)
  assets:
    - assets/images/

  # GPU shaders for preprocessing
  shaders:
    - shaders/yolo_preprocess.frag
    - shaders/mobilenet_preprocess.frag
    - shaders/movenet_preprocess.frag
    - shaders/blazeface_preprocess.frag

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
